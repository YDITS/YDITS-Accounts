<html lang="ja-JP">

<head prefix="og: https://ogp.me/ns#">
    <meta charset="UTF-8">

    <!-- Meta -->
    <title>Login | YDITS Account</title>
    <meta name="description" content="Login to your YDITS Account.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- OGP -->
    <meta property="og:url" content="https://accounts.ydits.net/login">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="YDITS Account">
    <meta property="og:title" content="Login">
    <meta property="og:description" content="Login to your YDITS Account.">
    <meta property="og:image" content="https://cdn.ydits.net/images/ydits-logos/ydits_icon.png">

    <!-- Preconnects -->
    <link rel="preconnect" href="https://cdn.yoneyo.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Icons -->
    <link rel="shortcut icon" href="https://cdn.ydits.net/images/ydits-logos/ydits_icon.png" type="image/png">

    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.yoneyo.com/styles/local-noto-sans-jp.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap">

    <!-- Styles -->
    <link rel="stylesheet" href="/styles/common.css">

    <!-- Scripts -->
    <script src="/scripts/common.mjs" type="module"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QCJH2VXW1J"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-QCJH2VXW1J');
    </script>
</head>

<body>
    <main class="auth-page">
        <h1 class="page-title auth-page-title">YDITS Account</h1>

        <form id="loginForm" class="auth-form" action="">
            <h2 for="loginForm" class="form-title">Login</h2>

            <div class="form-item">
                <label for="loginFormEmail" class="form-label">Email</label>
                <input id="loginFormEmail" class="form-input" type="email" placeholder="Email" required />
            </div>

            <div class="form-item">
                <label for="loginFormPassword" class="form-label">Password</label>
                <input id="loginFormPassword" class="form-input" type="password" placeholder="Password" required />
            </div>

            <span id="loginFormErrorMessage" class="form-item form-error"></span>

            <div class="form-item">
                <button id="loginSubmitButton" class="button form-submit-button auth-submit-button" type="button">
                    Login
                </button>
            </div>

            <a href="/signup" class="link">Create account</a>
        </form>

        <div class="policies">
            <ul style="list-style: none">
                <li>
                    <a href="https://policies.ydits.net/">Policy</a>
                </li>
            </ul>
        </div>
    </main>
</body>

</html>

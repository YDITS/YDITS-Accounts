<html lang="ja-JP">

<head>
    <meta charset="UTF-8">

    <!-- Meta -->
    <title>Sign Up | YDITS Account</title>
    <meta name="description" content="Sign up your YDITS Account.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- OGP -->
    <meta property="og:url" content="https://accounts.ydits.net/signup">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="YDITS Account">
    <meta property="og:title" content="Sign Up">
    <meta property="og:description" content="Sign up your YDITS Account.">
    <meta property="og:image" content="https://cdn.ydits.net/images/ydits-logos/ydits_icon.png">

    <!-- Preconnects -->
    <link rel="preconnect" href="https://cdn.yoneyo.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Icons -->
    <link rel="shortcut icon" href="https://cdn.ydits.net/images/ydits-logos/ydits_icon.png" type="image/png">

    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.yoneyo.com/styles/local-noto-sans-jp.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap">

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/common.css">

    <!-- Scripts -->
    <script src="/scripts/common.mjs" type="module" defer></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QCJH2VXW1J"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-QCJH2VXW1J');
    </script>
</head>

<body>
    <main class="auth-page">
        <h1 class="auth-page__title">YDITS Account</h1>

        <form id="loginForm" class="auth-form">
            <h2 class="auth-form__title">Sign Up</h2>

            <div class="auth-form__item">
                <label for="loginFormEmail" class="auth-form__label">Email</label>
                <input id="loginFormEmail" class="auth-form__input" type="email" name="email" autocomplete="email"
                    required>
            </div>

            <div class="auth-form__item">
                <label for="loginFormPassword" class="auth-form__label">Password</label>
                <input id="loginFormPassword" class="auth-form__input" type="password" name="password"
                    autocomplete="current-password" required>
            </div>

            <span id="loginFormErrorMessage" class="auth-form__item auth-form__error"></span>

            <div class="auth-form__item">
                <button id="signupSubmitButton" class="button auth-form__submit-button" type="button">
                    Sign up
                </button>
            </div>

            <div>
                <p>
                    Already have an account?
                    <a href="/login" class="link">Login</a>
                </p>
            </div>
        </form>
    </main>

    <footer>
        <a href="https://policies.ydits.net/" class="link policies__link">Terms and Policies</a>
        <div>
            <span>
                © よね/Yone
            </span>
        </div>
    </footer>
</body>

</html>
